name: CI

# Runs the tests on every push and pull request. Publishing is not done
# here: Netlify builds and publishes the site from main (see netlify.toml).

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # node:sqlite without the experimental flag needs Node 23.4+
          node-version: '24'

      - name: node --test
        run: node --test
